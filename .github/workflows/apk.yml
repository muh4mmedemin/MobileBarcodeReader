name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Imza anahtarini hazirla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret'i tanimli degil. Settings > Secrets and variables > Actions altina ekleyin."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/barkod.keystore

      - name: APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Surumu oku
        id: surum
        run: |
          SURUM=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          echo "ad=$SURUM" >> "$GITHUB_OUTPUT"
          echo "Surum: $SURUM"

      - name: APK dosyasini adlandir
        run: cp app/build/outputs/apk/debug/app-debug.apk BarkodOkuyucu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BarkodOkuyucu-v${{ steps.surum.outputs.ad }}
          path: BarkodOkuyucu.apk

      # Her surum kendi release'inde saklanir (v1.6, v1.7 ...). En yenisi "Latest" olur;
      # her zaman en yeni APK: https://github.com/<repo>/releases/latest/download/BarkodOkuyucu.apk
      - name: Surum olarak yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.surum.outputs.ad }}
          target_commitish: ${{ github.sha }}
          name: Barkod Okuyucu v${{ steps.surum.outputs.ad }}
          body: |
            Telefona indirmek icin asagidaki BarkodOkuyucu.apk dosyasina dokunun.
            Commit: ${{ github.sha }}
          files: BarkodOkuyucu.apk
          overwrite_files: true
          make_latest: true
