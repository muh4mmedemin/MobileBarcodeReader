name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK dosyasini adlandir
        run: cp app/build/outputs/apk/debug/app-debug.apk BarkodOkuyucu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BarkodOkuyucu-apk
          path: BarkodOkuyucu.apk

      - name: Release olarak yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-son
          name: Barkod Okuyucu APK
          body: Telefona indirmek icin BarkodOkuyucu.apk dosyasina dokunun.
          files: BarkodOkuyucu.apk
          make_latest: true
