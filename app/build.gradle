plugins {
    id 'com.android.application'
}

android {
    namespace 'com.muhammed.barkod'
    compileSdk 34

    defaultConfig {
        applicationId 'com.muhammed.barkod'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // zxing-android-embedded androidx.core / fragment siniflarini kullaniyor ama bagimlilik olarak getirmiyor
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
