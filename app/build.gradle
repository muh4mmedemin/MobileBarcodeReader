plugins {
    id 'com.android.application'
}

android {
    namespace 'com.muhammed.barkod'
    compileSdk 34

    defaultConfig {
        applicationId 'com.muhammed.barkod'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    // Sabit imza: GitHub Actions, KEYSTORE_BASE64 secret'indan app/barkod.keystore dosyasini olusturur.
    // Boylece her derleme ayni anahtarla imzalanir ve telefon eskisinin uzerine kurabilir.
    def keystoreDosyasi = file('barkod.keystore')
    def keystoreSifresi = System.getenv('KEYSTORE_PASSWORD')
    def sabitImzaVar = keystoreDosyasi.exists() && keystoreSifresi

    signingConfigs {
        if (sabitImzaVar) {
            sabit {
                storeFile keystoreDosyasi
                storePassword keystoreSifresi
                keyAlias 'barkod'
                keyPassword keystoreSifresi
            }
        }
    }

    buildTypes {
        debug {
            if (sabitImzaVar) {
                signingConfig signingConfigs.sabit
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // zxing-android-embedded androidx.core / fragment siniflarini kullaniyor ama bagimlilik olarak getirmiyor
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
